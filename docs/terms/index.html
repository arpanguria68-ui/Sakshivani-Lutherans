<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terms & Conditions · Sakshi Vani</title>
  <meta name="description" content="Sakshi Vani terms of service — USA, Europe, and India." />
  <meta name="theme-color" content="#93452B" />
  <link rel="icon" href="../assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+Devanagari:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="../">
        <img src="../assets/icon.png" alt="" width="42" height="42" />
        <span class="brand__text">
          <span class="brand__hi">साक्षी वाणी</span>
          <span class="brand__en">Sakshi Vani</span>
        </span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="../">Home</a>
        <a href="../privacy/" data-i18n data-en="Privacy" data-hi="गोपनीयता">Privacy</a>
        <a href="./" aria-current="page" data-i18n data-en="Terms" data-hi="नियम">Terms</a>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="hi" aria-pressed="false">हिं</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="legal-shell">
    <div class="legal-shell__top">
      <h1 data-i18n data-en="Terms & Conditions" data-hi="नियम और शर्तें">Terms & Conditions</h1>
      <p style="margin:0;color:var(--muted);font-size:0.9rem">USA · EU · India</p>
    </div>
    <article id="legal-content" class="loading">Loading…</article>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p><a href="../">← Sakshi Vani</a></p>
      <p><a href="../privacy/">Privacy Policy</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../js/site.js"></script>
  <script>
    function load() {
      window.SakshiPages.loadLegal({
        en: "../legal/TERMS.md",
        hi: "../legal/TERMS_HI.md",
        mount: "#legal-content",
      });
    }
    load();
    window.addEventListener("sv:lang", load);
  </script>
</body>
</html>
