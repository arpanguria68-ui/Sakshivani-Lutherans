name: sakshi_vani
description: Offline-first Sakshi Vani Flutter app with optional Firebase sync.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.3.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.1.0
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  uuid: ^4.5.1
  app_settings: ^5.1.1
  flutter_markdown: ^0.7.7+1
  volume_controller: ^2.0.8
  timezone: ^0.10.1
  share_plus: ^10.1.4
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  http: ^1.2.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Sakshivani_Unicode_Clean.db
    - assets/durang_puthi.json
    - catechism.json
    - quiz_data.json
    - bible_db.zip
    - assets/sounds/page_turn.wav
    - assets/sounds/page_flip.mp3

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: sakshivani-rn/assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: sakshivani-rn/assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSerifDevanagari
      fonts:
        - asset: sakshivani-rn/assets/fonts/NotoSerifDevanagari-Regular.ttf
          weight: 400
        - asset: sakshivani-rn/assets/fonts/NotoSerifDevanagari-SemiBold.ttf
          weight: 600
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader/Newsreader-Regular.ttf
        - asset: assets/fonts/newsreader/Newsreader-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
